      <p>Aqademiq is a product of R13 Labs India Private Limited. Support URL: <a href="https://aqademiq.com/support">https://aqademiq.com/support</a>.</p>

      <ul>
        <li>Smart Weekly Planning — AI-generated study schedules that adapt in real-time</li>
        <li>AI Study Coach (Ada) — Personalized guidance, micro-task breakdowns, and motivation</li>
        <li>ADHD-Friendly Design — Sensory-friendly modes, low-distraction layouts, adaptive notifications</li>
        <li>Grade Analytics — Track performance across all courses with visual dashboards</li>
        <li>Focus Timer — Customizable Pomodoro timer with ambient sounds</li>
        <li>Calendar & LMS Integration — Sync with Google Calendar, Apple Calendar, Canvas, Blackboard</li>
      </ul>
      <h2>Why Students Choose Aqademiq</h2>
      <p>Most study apps are task managers with a study coat of paint. Aqademiq is built on behavioral psychology and adaptive AI. It explains why and when to study, prevents decision paralysis, and adapts to how students actually think.</p>
